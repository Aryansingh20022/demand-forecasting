[project]
name = "demand-forecasting"
version = "0.1.0"
description = "Demand forecasting and inventory optimization portfolio project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
  "jupyter>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
